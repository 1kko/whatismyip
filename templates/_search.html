{# The search box, shared by browser.html and error.html. static/js/app.js
   finds every element in it by id, so there is one copy to keep in step. #}
<header class="topbar inset">
    <div class="search-wrap">
        <form class="search" id="lookup-form" action="/" method="get" autocomplete="off">
            <input type="text" id="lookup-input" name="q" spellcheck="false"
                   placeholder="Enter a domain or IP address"
                   aria-label="Domain or IP address to look up"
                   aria-describedby="lookup-error">
            <kbd class="search__hint">/</kbd>
            <span class="search__spinner" aria-hidden="true"></span>
        </form>
        <p class="search-error" id="lookup-error" role="alert" hidden></p>
        <p class="search-status" id="lookup-status" role="status" hidden></p>
    </div>
</header>
